<label class="secret-field">
  <span class="label">{{ label }}</span>
  @if (hasStoredToken) {
    <span class="stored-hint">Токен сохранён. Оставьте поле пустым, чтобы не менять.</span>
  }
  <div class="input-wrap">
    <input
      [type]="visible ? 'text' : 'password'"
      [value]="value"
      [disabled]="disabled"
      [attr.maxlength]="maxLength"
      [placeholder]="hasStoredToken ? 'Новый токен (необязательно)' : placeholder"
      autocomplete="off"
      spellcheck="false"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
    />
    <button
      type="button"
      class="toggle-btn"
      [title]="visible ? 'Скрыть' : 'Показать'"
      [attr.aria-label]="visible ? 'Скрыть' : 'Показать'"
      [disabled]="disabled"
      (click)="toggleVisible()"
    >
      {{ visible ? 'Скрыть' : 'Показ' }}
    </button>
  </div>
  @if (hint) {
    <span class="field-hint">{{ hint }}</span>
  }
</label>
