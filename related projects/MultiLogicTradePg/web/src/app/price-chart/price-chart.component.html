@if (fullscreen) {
  <div class="chart-backdrop" (click)="closeFullscreen()" role="presentation"></div>
}

<div class="chart-shell" [class.chart-shell--fullscreen]="fullscreen">
  <div class="chart-toolbar" role="toolbar" aria-label="Управление графиком">
    @if (fullscreen && title) {
      <span class="chart-title">{{ title }}</span>
    }
      <span
        class="chart-mode-toggle"
        role="group"
        aria-label="Вид графика цены"
      >
        <button
          type="button"
          class="chart-btn chart-btn-mode"
          [class.chart-btn-active]="viewMode === 'candles'"
          title="Свечной график"
          aria-label="Свечной график"
          [disabled]="candles.length === 0"
          (click)="setViewMode('candles', $event)"
        >▮▮</button>
        <button
          type="button"
          class="chart-btn chart-btn-mode"
          [class.chart-btn-active]="viewMode === 'line'"
          title="Линейный график (цены закрытия)"
          aria-label="Линейный график"
          [disabled]="candles.length === 0"
          (click)="setViewMode('line', $event)"
        >∿</button>
      </span>
      <div class="chart-toolbar-group">
        @if (showRecalcButton) {
        <button
          type="button"
          class="chart-btn"
          title="Пересчитать индикаторы для видимого участка"
          aria-label="Пересчитать индикаторы"
          [disabled]="loading || candles.length === 0"
          (click)="onRecalcClick($event)"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.99 5.99 0 0 1-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      }
      <button
        type="button"
        class="chart-btn"
        title="Уменьшить масштаб"
        aria-label="Уменьшить"
        [disabled]="candles.length === 0"
        (click)="zoomOut($event)"
      >−</button>
      <button
        type="button"
        class="chart-btn"
        title="Увеличить масштаб"
        aria-label="Увеличить"
        [disabled]="candles.length === 0"
        (click)="zoomIn($event)"
      >+</button>
      <button
        type="button"
        class="chart-btn"
        title="Сдвинуть назад"
        aria-label="Назад"
        [disabled]="candles.length === 0"
        (click)="panLeft($event)"
      >◀</button>
      <button
        type="button"
        class="chart-btn"
        title="Сдвинуть вперёд"
        aria-label="Вперёд"
        [disabled]="candles.length === 0"
        (click)="panRight($event)"
      >▶</button>
      @if (hasTradeNav) {
        <button
          type="button"
          class="chart-btn chart-btn-trade"
          title="Предыдущая сделка (открытие или закрытие)"
          aria-label="Предыдущая сделка"
          [disabled]="candles.length === 0"
          (click)="gotoPrevTrade($event)"
        >⟸ сд.</button>
        <button
          type="button"
          class="chart-btn chart-btn-trade"
          title="Следующая сделка (открытие или закрытие)"
          aria-label="Следующая сделка"
          [disabled]="candles.length === 0"
          (click)="gotoNextTrade($event)"
        >сд. ⟹</button>
      }
      @if (!fullscreen) {
        <button
          type="button"
          class="chart-btn chart-btn-expand"
          title="Полный экран"
          aria-label="Полный экран"
          [disabled]="candles.length === 0 && !error"
          (click)="openFullscreen(); $event.stopPropagation()"
        >
          <span class="chart-btn-expand-label" aria-hidden="true">⛶</span>
          <span class="chart-btn-expand-text">Полный экран</span>
        </button>
      }
    </div>
    <div class="chart-toolbar-group chart-toolbar-end">
      @if (fullscreen) {
        <button
          type="button"
          class="chart-btn"
          title="Закрыть полный экран"
          aria-label="Закрыть"
          (click)="closeFullscreen(); $event.stopPropagation()"
        >✕</button>
      }
    </div>
  </div>

  <div
    #chartBody
    class="chart-body"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)"
    (touchcancel)="onTouchEnd($event)"
  >
    <canvas
      #canvas
      class="chart-canvas"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)"
      (pointerleave)="onPointerLeave($event)"
      (wheel)="onWheel($event)"
    ></canvas>
    <p class="chart-hint" [class.chart-hint--fullscreen]="fullscreen">
      Колёсико / pinch — масштаб · перетаскивание — история
    </p>
  </div>
</div>
