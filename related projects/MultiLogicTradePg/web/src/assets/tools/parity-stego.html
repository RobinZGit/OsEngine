<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Crypt — Parity Stego</title>
  <style>
:root {
  --bg: #1a2332;
  --bg-elevated: #243044;
  --strip: #15202e;
  --ink: #e8eef6;
  --muted: #8b9bb0;
  --accent: #3d9a7a;
  --accent-hover: #48b08c;
  --secondary: #4a6fa5;
  --secondary-hover: #5a82bc;
  --line: #314257;
  --danger: #c45c5c;
  --radius: 10px;
  --font: "Segoe UI", "Helvetica Neue", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse at 20% 0%, #2a3d55 0%, transparent 50%),
    radial-gradient(ellipse at 100% 80%, #1e3a32 0%, transparent 45%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font);
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: linear-gradient(180deg, var(--strip), #101824);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}

.strip-left,
.strip-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.key-field {
  display: flex;
  align-items: center;
  gap: 8px;
}

.key-field label {
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.key-field input {
  width: min(180px, 40vw);
  min-height: 40px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink);
  font: inherit;
}

.key-field input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 4px 2px;
}

.lang-switch label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
  min-height: 36px;
}

.lang-switch input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

.mode-switch {
  display: inline-flex;
  padding: 3px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 999px;
}

.mode-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 16px;
  border-radius: 999px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  min-height: 40px;
  touch-action: manipulation;
}

.mode-btn.is-active {
  background: var(--ink);
  color: var(--strip);
}

.btn {
  appearance: none;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 10px 14px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  min-height: 42px;
  touch-action: manipulation;
}

.btn-primary {
  background: var(--accent);
  color: #06241a;
}

.btn-primary:hover {
  background: var(--accent-hover);
}

.btn-secondary {
  background: var(--secondary);
  color: #f4f7fb;
}

.btn-secondary:hover {
  background: var(--secondary-hover);
}

.btn-ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--ink);
}

.btn-ghost:hover {
  background: var(--bg-elevated);
}

.btn:disabled,
.btn:disabled:hover {
  opacity: 0.45;
  cursor: not-allowed;
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

.workspace {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  min-height: 0;
}

.panel {
  display: none;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  flex: 1;
}

.panel.is-visible {
  display: flex;
}

.field-label {
  font-size: 0.85rem;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Text: scroll down only */
.scroll-pane-y {
  width: 100%;
  max-height: min(52vh, 480px);
  overflow-x: hidden;
  overflow-y: scroll; /* always show thick bar — easier to grab with a finger */
  -webkit-overflow-scrolling: touch;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  scrollbar-width: auto;
  scrollbar-color: #5a7a6a #243044;
}

.scroll-pane-y textarea {
  display: block;
  width: 100%;
  min-height: min(48vh, 440px);
  height: min(48vh, 440px);
  border: 0;
  border-radius: 0;
  resize: none;
  overflow-y: auto;
  box-sizing: border-box;
}

textarea {
  width: 100%;
  min-height: 220px;
  resize: vertical;
  padding: 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink);
  font: inherit;
  font-size: 1.05rem;
  line-height: 1.45;
}

textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.canvas-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.hint {
  color: var(--muted);
  font-size: 0.9rem;
}

.template-name {
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 10px 14px;
  width: 100%;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}

.brand-name {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--ink);
}

.brand-row .lang-switch {
  padding: 0;
}

.brand-row .version-badge {
  margin-left: auto;
}

.version-badge {
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: #c8f0dc;
  background: #1e4a3a;
  padding: 8px 14px;
  border: 1px solid #3d9a7a;
  border-radius: 8px;
  white-space: nowrap;
  user-select: text;
}

.version-bar {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 10px 16px 0;
  font-size: 1rem;
  font-weight: 700;
  color: #9ec9b8;
}

/* Image: scroll down and sideways when larger than the viewport */
.scroll-pane-xy {
  width: 100%;
  max-height: min(55vh, 560px);
  overflow: scroll; /* always show thick bars for finger drag (not mouse-thin overlay) */
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #ffffff;
  touch-action: pan-x pan-y;
  /* Firefox: thick finger-friendly scrollbars */
  scrollbar-width: auto;
  scrollbar-color: #5a7a6a #d8e2ec;
}

.scroll-pane-xy canvas {
  display: block;
  width: auto;
  height: auto;
  max-width: none;
  cursor: crosshair;
  touch-action: none;
}

/*
 * Thick scrollbars for tablet fingers (not mouse-thin overlay bars).
 * WebKit / Chromium / Android Chrome — grab with a finger to scroll.
 */
.scroll-pane-xy::-webkit-scrollbar,
.scroll-pane-y::-webkit-scrollbar {
  width: 36px;
  height: 36px;
}

.scroll-pane-xy::-webkit-scrollbar-track {
  background: #d8e2ec;
  border-radius: 18px;
  margin: 2px;
}

.scroll-pane-y::-webkit-scrollbar-track {
  background: #1a2838;
  border-radius: 18px;
  margin: 2px;
}

.scroll-pane-xy::-webkit-scrollbar-thumb,
.scroll-pane-y::-webkit-scrollbar-thumb {
  background: #3d9a7a;
  border-radius: 18px;
  border: 5px solid transparent;
  background-clip: padding-box;
  min-height: 56px;
  min-width: 56px;
}

.scroll-pane-xy::-webkit-scrollbar-thumb:hover,
.scroll-pane-y::-webkit-scrollbar-thumb:hover,
.scroll-pane-xy::-webkit-scrollbar-thumb:active,
.scroll-pane-y::-webkit-scrollbar-thumb:active {
  background: #48b08c;
  border: 4px solid transparent;
  background-clip: padding-box;
}

.scroll-pane-xy::-webkit-scrollbar-corner {
  background: #d8e2ec;
  border-radius: 10px;
}

/* Big finger buttons — Android often hides CSS scrollbars */
.scroll-shell {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  min-height: 0;
}

.scroll-shell-mid {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 6px;
  min-height: 0;
  flex: 1;
}

.scroll-shell-mid .scroll-pane-xy {
  flex: 1;
  min-width: 0;
}

.scroll-btn {
  appearance: none;
  border: 2px solid #3d9a7a;
  background: #1e4a3a;
  color: #c8f0dc;
  font-size: 1.25rem;
  font-weight: 800;
  border-radius: 14px;
  min-width: 52px;
  min-height: 52px;
  padding: 8px 10px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.scroll-btn-up,
.scroll-btn-down {
  width: 100%;
  min-height: 56px;
}

.scroll-btn-left,
.scroll-btn-right {
  align-self: stretch;
  min-width: 56px;
}

.scroll-btn:active {
  background: #3d9a7a;
  color: #06241a;
}

.canvas-wrap {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: #ffffff;
  touch-action: none;
}

canvas {
  display: block;
  cursor: crosshair;
  touch-action: none;
}

.status {
  min-height: 1.2em;
  margin: 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.result-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

.result-panel[hidden] {
  display: none !important;
}

.result-title {
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
  color: var(--muted);
}

.decrypt-text {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  padding: 14px;
  border: 0;
  border-radius: 0;
  background: transparent;
  font: inherit;
  font-size: 1.05rem;
  line-height: 1.45;
  min-height: 120px;
}

@media (max-width: 640px) {
  .strip {
    padding: 10px 12px;
  }

  .workspace {
    padding: 12px;
  }

  .btn {
    padding: 10px 12px;
  }

  .scroll-pane-y,
  .scroll-pane-xy {
    max-height: min(48vh, 420px);
  }
}

  </style>
</head>
<body>
  <div class="app">
    <header class="strip">
      <div class="brand-row">
        <span class="brand-name">Crypt</span>
        <div class="lang-switch" role="group" aria-label="Language">
          <label><input type="checkbox" id="langRu" checked /> Русский</label>
          <label><input type="checkbox" id="langEn" /> English</label>
        </div>
        <span id="appVersion" class="version-badge" title="Crypt build on GitHub Pages">Crypt v1.20</span>
      </div>
      <div class="strip-left">
        <div class="mode-switch" role="group" aria-label="Mode" id="modeSwitch">
          <button type="button" id="modeText" class="mode-btn is-active" data-mode="text">Текст</button>
          <button type="button" id="modePicture" class="mode-btn" data-mode="picture" title="Рукописная заметка (чёрно-белая)">Заметка</button>
        </div>
        <div class="key-field">
          <label for="encKey" id="labelKey">Ключ</label>
          <input type="text" id="encKey" placeholder="пусто или от 3 символов" value="" autocomplete="off" spellcheck="false" />
          <button type="button" id="btnRefresh" class="btn btn-ghost" disabled title="Сначала загрузите файл через «Расшифровать»">Обновить</button>
        </div>
      </div>
      <div class="strip-right">
        <button type="button" id="btnTemplate" class="btn btn-ghost">Шаблон</button>
        <button type="button" id="btnEncrypt" class="btn btn-primary">Шифровать</button>
        <button type="button" id="btnDecrypt" class="btn btn-secondary">Расшифровать</button>
        <span id="templateName" class="hint template-name"></span>
      </div>
    </header>

    <p id="versionBar" class="version-bar" aria-live="polite">Сборка: Crypt v1.20</p>

    <main class="workspace">
      <section id="panelText" class="panel is-visible">
        <div class="canvas-toolbar">
          <button type="button" id="btnLoadText" class="btn btn-ghost">Загрузить файл</button>
          <span class="hint" id="hintText">Текст прокручивается вниз · длинный текст растягивает шаблон при шифровании</span>
        </div>
        <label class="field-label" for="message" id="labelMessage">Сообщение</label>
        <div class="scroll-pane-y">
          <textarea id="message" placeholder="Введите текст для шифрования…" rows="16"></textarea>
        </div>
        <p id="textStatus" class="status" aria-live="polite"></p>
      </section>

      <section id="panelPicture" class="panel">
        <div class="canvas-toolbar">
          <button type="button" id="btnClear" class="btn btn-ghost">Очистить</button>
          <button type="button" id="btnGrowNote" class="btn btn-ghost" title="Увеличить холст заметки">Больше</button>
          <span id="noteSizeLabel" class="hint">Заметка 800×500 · прокрутка вниз и вбок</span>
        </div>
        <div class="scroll-shell" id="drawScrollShell">
          <button type="button" class="scroll-btn scroll-btn-up" data-scroll="drawScroll" data-dx="0" data-dy="-160" aria-label="Scroll up">▲</button>
          <div class="scroll-shell-mid">
            <button type="button" class="scroll-btn scroll-btn-left" data-scroll="drawScroll" data-dx="-160" data-dy="0" aria-label="Scroll left">◀</button>
            <div id="drawScroll" class="scroll-pane-xy">
              <canvas id="drawCanvas" width="800" height="500"></canvas>
            </div>
            <button type="button" class="scroll-btn scroll-btn-right" data-scroll="drawScroll" data-dx="160" data-dy="0" aria-label="Scroll right">▶</button>
          </div>
          <button type="button" class="scroll-btn scroll-btn-down" data-scroll="drawScroll" data-dx="0" data-dy="160" aria-label="Scroll down">▼</button>
        </div>
        <p id="pictureStatus" class="status" aria-live="polite"></p>
      </section>

      <section id="panelResult" class="result-panel" hidden>
        <h2 class="result-title" id="resultTitle">Результат расшифровки (одна картинка · чёт→белый · нечёт→чёрный)</h2>
        <div id="decryptTextScroll" class="scroll-pane-y" hidden>
          <pre id="decryptText" class="decrypt-text"></pre>
        </div>
        <div class="scroll-shell" id="decryptScrollShell" hidden>
          <button type="button" class="scroll-btn scroll-btn-up" data-scroll="decryptCanvasWrap" data-dx="0" data-dy="-160" aria-label="Scroll up">▲</button>
          <div class="scroll-shell-mid">
            <button type="button" class="scroll-btn scroll-btn-left" data-scroll="decryptCanvasWrap" data-dx="-160" data-dy="0" aria-label="Scroll left">◀</button>
            <div id="decryptCanvasWrap" class="scroll-pane-xy">
              <canvas id="decryptCanvas" width="800" height="500"></canvas>
            </div>
            <button type="button" class="scroll-btn scroll-btn-right" data-scroll="decryptCanvasWrap" data-dx="160" data-dy="0" aria-label="Scroll right">▶</button>
          </div>
          <button type="button" class="scroll-btn scroll-btn-down" data-scroll="decryptCanvasWrap" data-dx="0" data-dy="160" aria-label="Scroll down">▼</button>
        </div>
      </section>
    </main>

    <!-- No accept=… → Android/Chrome opens the system file manager (all files, any folder). -->
    <input type="file" id="fileInput" hidden />
    <input type="file" id="templateInput" hidden />
    <input type="file" id="textFileInput" hidden />
  </div>

      pickTemplate: "Pick any file (file manager / Downloads). Must be a picture for template.",
      pickText: "Pick any file — contents loaded as text.",
      cleared: "Canvas cleared.",
      grew: (w, h) =>
        `Note canvas enlarged to ${w}×${h}. Scroll down & sideways. Template stretches to this size on Encrypt.`,
      encryptingNote: "Encrypting note into template…",
      emptyDecrypt: "(empty / no text found)",
      refreshNeedFile:
        "No file loaded yet. Press Decrypt and pick a file first — then Refresh applies the new Key to it.",
      refreshAgain: (name) =>
        `Refresh: same file “${name}” · current Key · no file picker…`,
      refreshKeyShort: (n, min) =>
        `Refresh did nothing: key is ${n} character(s). Key must be empty or ${min}+ characters.`,
    },
  };

  let lang = "ru";

  function t(key, ...args) {
    const pack = I18N[lang] || I18N.ru;
    const val = pack[key];
    if (typeof val === "function") return val(...args);
    return val != null ? val : key;
  }

  function applyLanguage() {
    const pack = I18N[lang] || I18N.ru;
    document.documentElement.lang = lang === "ru" ? "ru" : "en";
    els.modeText.textContent = pack.modeText;
    els.modePicture.textContent = pack.modeNote;
    els.modePicture.title = pack.modeNoteTitle;
    const labelKey = document.getElementById("labelKey");
    if (labelKey) labelKey.textContent = pack.key;
    els.encKey.placeholder = pack.keyPh;
    els.btnTemplate.textContent = pack.template;
    els.btnEncrypt.textContent = pack.encrypt;
    els.btnDecrypt.textContent = pack.decrypt;
    if (els.btnRefresh) {
      els.btnRefresh.textContent = pack.refresh;
      updateRefreshButton();
    }
    els.btnLoadText.textContent = pack.loadFile;
    const hintText = document.getElementById("hintText");
    if (hintText) hintText.textContent = pack.hintText;
    const labelMessage = document.getElementById("labelMessage");
    if (labelMessage) labelMessage.textContent = pack.message;
    els.message.placeholder = pack.messagePh;
    els.btnClear.textContent = pack.clear;
    if (els.btnGrowNote) {
      els.btnGrowNote.textContent = pack.larger;
      els.btnGrowNote.title = pack.largerTitle;
    }
    const resultTitle = document.getElementById("resultTitle");
    if (resultTitle) resultTitle.textContent = pack.resultTitle;
    const modeSwitch = document.getElementById("modeSwitch");
    if (modeSwitch) modeSwitch.setAttribute("aria-label", pack.modeGroup);
    const langSwitch = document.querySelector(".lang-switch");
    if (langSwitch) langSwitch.setAttribute("aria-label", pack.langGroup);
    const versionBar = document.getElementById("versionBar");
    if (versionBar) versionBar.textContent = pack.build + ": " + APP_VERSION;
    updateNoteSizeLabel();
    if (els.langRu) els.langRu.checked = lang === "ru";
    if (els.langEn) els.langEn.checked = lang === "en";
  }

  function setLanguage(next) {
    lang = next === "en" ? "en" : "ru";
    try {
      localStorage.setItem("crypt-lang", lang);
    } catch (_) {
      /* ignore */
    }
    applyLanguage();
    setStatus(APP_VERSION + t("ready"));
  }

  const els = {
    modeText: document.getElementById("modeText"),
    modePicture: document.getElementById("modePicture"),
    panelText: document.getElementById("panelText"),
    panelPicture: document.getElementById("panelPicture"),
    panelResult: document.getElementById("panelResult"),
    message: document.getElementById("message"),
    textStatus: document.getElementById("textStatus"),
    pictureStatus: document.getElementById("pictureStatus"),
    drawCanvas: document.getElementById("drawCanvas"),
    decryptCanvas: document.getElementById("decryptCanvas"),
    decryptText: document.getElementById("decryptText"),
    decryptTextScroll: document.getElementById("decryptTextScroll"),
    decryptCanvasWrap: document.getElementById("decryptCanvasWrap"),
    decryptScrollShell: document.getElementById("decryptScrollShell"),
    noteSizeLabel: document.getElementById("noteSizeLabel"),
    btnEncrypt: document.getElementById("btnEncrypt"),
    btnDecrypt: document.getElementById("btnDecrypt"),
    btnRefresh: document.getElementById("btnRefresh"),
    btnTemplate: document.getElementById("btnTemplate"),
    btnClear: document.getElementById("btnClear"),
    btnGrowNote: document.getElementById("btnGrowNote"),
    fileInput: document.getElementById("fileInput"),
    templateInput: document.getElementById("templateInput"),
    textFileInput: document.getElementById("textFileInput"),
    templateName: document.getElementById("templateName"),
    encKey: document.getElementById("encKey"),
    btnLoadText: document.getElementById("btnLoadText"),
    langRu: document.getElementById("langRu"),
    langEn: document.getElementById("langEn"),
  };

  let mode = "text"; // "text" | "picture" (UI label: Note = handwritten note)
  let drawing = false;
  let lastPoint = null;
  /** User-chosen carrier image (HTMLImageElement), or null → built-in default. */
  let customTemplate = null;
  let customTemplateName = "";
  /**
   * Last file loaded via Decrypt — Refresh re-decrypts it with the current Key.
   * Not set by Encrypt. Button stays disabled until Decrypt loads a file.
   */
  let lastDecryptBlob = null;
  let lastDecryptName = "";

  function updateRefreshButton() {
    if (!els.btnRefresh) return;
    const hasFile = !!lastDecryptBlob;
    els.btnRefresh.disabled = !hasFile;
    els.btnRefresh.title = hasFile ? t("refreshTitle") : t("refreshDisabledTitle");
  }

  const drawCtx = els.drawCanvas.getContext("2d", { willReadFrequently: true });
  const decryptCtx = els.decryptCanvas.getContext("2d", { willReadFrequently: true });

  function setStatus(text) {
    if (mode === "text") els.textStatus.textContent = text;
    else els.pictureStatus.textContent = text;
  }

  function setMode(next, options) {
    const keepResult = options && options.keepResult;
    mode = next;
    els.modeText.classList.toggle("is-active", mode === "text");
    els.modePicture.classList.toggle("is-active", mode === "picture");
    els.panelText.classList.toggle("is-visible", mode === "text");
    els.panelPicture.classList.toggle("is-visible", mode === "picture");
    if (!keepResult) {
      els.panelResult.hidden = true;
      els.decryptText.hidden = true;
      if (els.decryptTextScroll) els.decryptTextScroll.hidden = true;
      if (els.decryptScrollShell) els.decryptScrollShell.hidden = true;
      els.decryptCanvasWrap.hidden = true;
      setStatus("");
    }
  }

  function updateNoteSizeLabel() {
    if (!els.noteSizeLabel) return;
    els.noteSizeLabel.textContent = t("noteSize", els.drawCanvas.width, els.drawCanvas.height);
  }

  /** Resize note canvas; keeps existing ink when growing. */
  function resizeNoteCanvas(w, h) {
    w = Math.max(64, Math.min(4096, w | 0));
    h = Math.max(64, Math.min(4096, h | 0));
    const prevW = els.drawCanvas.width;
    const prevH = els.drawCanvas.height;
    if (w === prevW && h === prevH) {
      updateNoteSizeLabel();
      return;
    }
    let prev = null;
    try {
      prev = drawCtx.getImageData(0, 0, prevW, prevH);
    } catch (_) {
      prev = null;
    }
    els.drawCanvas.width = w;
    els.drawCanvas.height = h;
    clearDrawing();
    if (prev) {
      drawCtx.putImageData(prev, 0, 0);
    }
    updateNoteSizeLabel();
  }

  const INK_LINE_WIDTH = 22; // thick finger-friendly stroke (was 3 — too thin on tablet)

  function applyInkStyle() {
    drawCtx.strokeStyle = "#000000";
    drawCtx.fillStyle = "#000000";
    drawCtx.lineWidth = INK_LINE_WIDTH;
    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    drawCtx.miterLimit = 2;
  }

  function clearDrawing() {
    // White paper for handwritten notes; encode is strict black/white.
    drawCtx.fillStyle = "#ffffff";
    drawCtx.fillRect(0, 0, els.drawCanvas.width, els.drawCanvas.height);
    applyInkStyle();
  }

  function canvasPoint(canvas, event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / Math.max(rect.width, 1);
    const scaleY = canvas.height / Math.max(rect.height, 1);
    return {
      x: (event.clientX - rect.left) * scaleX,
      y: (event.clientY - rect.top) * scaleY,
    };
  }

  function strokeTo(point) {
    if (!lastPoint) {
      lastPoint = point;
      return;
    }
    applyInkStyle();
    drawCtx.beginPath();
    drawCtx.moveTo(lastPoint.x, lastPoint.y);
    drawCtx.lineTo(point.x, point.y);
    drawCtx.stroke();
    lastPoint = point;
  }

  function onPointerDown(e) {
    if (mode !== "picture") return;
    // Only primary button / touch / pen — ignore hover extras
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    try {
      els.drawCanvas.setPointerCapture(e.pointerId);
    } catch (_) {
      /* ignore */
    }
    drawing = true;
    lastPoint = canvasPoint(els.drawCanvas, e);
    applyInkStyle();
    // Dot with rounded tip so a tap is a thick visible mark
    drawCtx.beginPath();
    drawCtx.arc(lastPoint.x, lastPoint.y, INK_LINE_WIDTH / 2, 0, Math.PI * 2);
    drawCtx.fill();
  }

  function onPointerMove(e) {
    if (!drawing) return;
    e.preventDefault();
    strokeTo(canvasPoint(els.drawCanvas, e));
  }

  function onPointerUp(e) {
    if (!drawing) return;
    e.preventDefault();
    drawing = false;
    lastPoint = null;
    try {
      if (e && e.pointerId != null) els.drawCanvas.releasePointerCapture(e.pointerId);
    } catch (_) {
      /* ignore */
    }
  }

  /** Sum R+G+B+A parity: even = 0 (white), odd = 1 (black ink). */
  function pixelBit(data, index) {
    const i = index * 4;
    const sum = data[i] + data[i + 1] + data[i + 2] + data[i + 3];
    return sum & 1;
  }

  /**
   * Empty key → encrypt/decrypt without a key (no scrambling).
   * Non-empty key must be at least MIN_KEY_LEN characters.
   */
  function resolveKey() {
    const raw = (els.encKey.value || "").trim();
    if (!raw) {
      return { ok: true, key: "", withoutKey: true };
    }
    if (raw.length < MIN_KEY_LEN) {
      return {
        ok: false,
        error: t("keyShort", raw.length, MIN_KEY_LEN),
      };
    }
    return { ok: true, key: raw, withoutKey: false };
  }

  function hashKey(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function next() {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** XOR payload with keystream when a key is set; empty key leaves bits unchanged. */
  function applyKeyToBits(bits, key) {
    if (!key) return bits.slice();
    const rng = mulberry32(hashKey(key));
    const out = new Array(bits.length);
    for (let i = 0; i < bits.length; i++) {
      const kBit = rng() < 0.5 ? 0 : 1;
      out[i] = bits[i] ^ kBit;
    }
    return out;
  }

  function keyStatusPrefix(action, withoutKey, key) {
    if (withoutKey) return t("encNoKey", action);
    return t("encWithKey", action, key);
  }

  /**
   * Set parity of RGBA sum to desiredBit (0 even, 1 odd)
   * by nudging one channel ±1 when needed. Alpha stays 255.
   */
  function setPixelBit(data, index, desiredBit) {
    const i = index * 4;
    data[i + 3] = 255;
    const want = desiredBit & 1;
    if (((data[i] + data[i + 1] + data[i + 2] + data[i + 3]) & 1) === want) return;

    // Prefer blue, then green, then red — never leave alpha semi-transparent
    const order = [2, 1, 0];
    for (const ch of order) {
      const v = data[i + ch];
      if (v < 255) {
        data[i + ch] = v + 1;
        if (((data[i] + data[i + 1] + data[i + 2] + data[i + 3]) & 1) === want) return;
        data[i + ch] = v;
      }
      if (v > 0) {
        data[i + ch] = v - 1;
        if (((data[i] + data[i + 1] + data[i + 2] + data[i + 3]) & 1) === want) return;
        data[i + ch] = v;
      }
    }
  }

  function createDefaultCarrier() {
    const canvas = document.createElement("canvas");
    canvas.width = CARRIER_W;
    canvas.height = CARRIER_H;
    const ctx = canvas.getContext("2d");

    const g = ctx.createLinearGradient(0, 0, CARRIER_W, CARRIER_H);
    g.addColorStop(0, "#d8e4f0");
    g.addColorStop(0.45, "#c5d6c8");
    g.addColorStop(1, "#e2d5c4");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CARRIER_W, CARRIER_H);

    // Soft noise so the image looks natural and has varied parity
    const img = ctx.getImageData(0, 0, CARRIER_W, CARRIER_H);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() * 18) | 0;
      d[i] = Math.min(255, d[i] + n);
      d[i + 1] = Math.min(255, d[i + 1] + ((n * 0.7) | 0));
      d[i + 2] = Math.min(255, d[i + 2] + ((n * 0.5) | 0));
      d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);

    ctx.fillStyle = "rgba(40, 55, 70, 0.35)";
    ctx.font = "600 28px Segoe UI, sans-serif";
    ctx.fillText("Parity carrier template", 28, 48);
    ctx.font = "16px Segoe UI, sans-serif";
    ctx.fillText("Looks like a normal picture — data lives in pixel parity.", 28, 78);

    return canvas;
  }

  /** Raw template canvas at its natural size (or default). */
  function createCarrierCanvas() {
    if (!customTemplate) return createDefaultCarrier();

    const w = customTemplate.naturalWidth || customTemplate.width;
    const h = customTemplate.naturalHeight || customTemplate.height;
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(customTemplate, 0, 0, w, h);
    const imageData = ctx.getImageData(0, 0, w, h);
    const d = imageData.data;
    for (let i = 3; i < d.length; i += 4) d[i] = 255;
    ctx.putImageData(imageData, 0, 0);
    return canvas;
  }

  /**
   * Stretch (scale) template so it covers at least targetW×targetH.
   * If the note/image is larger than the template, the template is stretched up.
   */
  function stretchTemplateToSize(targetW, targetH) {
    const src = createCarrierCanvas();
    const outW = Math.max(1, targetW | 0);
    const outH = Math.max(1, targetH | 0);
    if (outW === src.width && outH === src.height) return src;

    const out = document.createElement("canvas");
    out.width = outW;
    out.height = outH;
    const ctx = out.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, 0, 0, src.width, src.height, 0, 0, outW, outH);
    const imageData = ctx.getImageData(0, 0, outW, outH);
    for (let i = 3; i < imageData.data.length; i += 4) imageData.data[i] = 255;
    ctx.putImageData(imageData, 0, 0);
    return out;
  }

  /** Keep old name used by note encrypt. */
  function expandTemplateToNoteSize(noteW, noteH) {
    return stretchTemplateToSize(Math.max(noteW, 1), Math.max(noteH, 1));
  }

  /** Grow carrier so it has at least bitCount pixels (for long text). */
  function stretchTemplateForBitCount(bitCount) {
    const src = createCarrierCanvas();
    let w = src.width;
    let h = src.height;
    if (w * h >= bitCount) return stretchTemplateToSize(w, h);
    const aspect = w / Math.max(h, 1);
    const scale = Math.sqrt(bitCount / (w * h));
    w = Math.ceil(w * scale);
    h = Math.ceil(h * scale);
    while (w * h < bitCount) {
      w += 1;
      h = Math.max(1, Math.ceil(w / aspect));
    }
    return stretchTemplateToSize(w, h);
  }

  async function setTemplateFromFile(file) {
    const img = await loadImageFromFile(file);
    customTemplate = img;
    customTemplateName = file.name || "template";
    els.templateName.textContent = customTemplateName;
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    // If template is larger than the note, grow the note so you can scroll the full area.
    if (w > els.drawCanvas.width || h > els.drawCanvas.height) {
      resizeNoteCanvas(Math.max(els.drawCanvas.width, w), Math.max(els.drawCanvas.height, h));
    }
    setStatus(
      `Template loaded: ${customTemplateName} (${w}×${h}). ` +
        `Note ${els.drawCanvas.width}×${els.drawCanvas.height}. ` +
        `On Encrypt the template is stretched if the note/text needs a larger size.`
    );
  }

  function downloadBlob(blob, filename) {
    if (!blob) {
      setStatus("Could not create file.");
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function rememberDecryptFile(file) {
    if (!file) return;
    // Clone so clearing <input type=file> does not drop the bytes we keep for Refresh.
    const type = file.type || "application/octet-stream";
    const name = file.name || lastDecryptName || "decrypt.png";
    lastDecryptBlob = file.slice(0, file.size, type);
    lastDecryptName = name;
    updateRefreshButton();
  }

  function downloadCanvas(canvas, filename) {
    canvas.toBlob((blob) => downloadBlob(blob, filename), "image/png");
  }

  function canvasToPngBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (!blob) reject(new Error("Could not create PNG."));
        else resolve(blob);
      }, "image/png");
    });
  }

  function textToBits(text) {
    // UTF-8 bytes: 8 pixels (bits) per byte — works for Cyrillic too
    const bytes = new TextEncoder().encode(text);
    if (bytes.length > 0xffffffff) throw new Error("Text too long");

    const bits = [];
    // length header = number of bytes (32 bits, big-endian)
    const len = bytes.length;
    for (let b = 31; b >= 0; b--) bits.push((len >>> b) & 1);

    for (let i = 0; i < bytes.length; i++) {
      const code = bytes[i];
      for (let b = 7; b >= 0; b--) bits.push((code >> b) & 1);
    }
    return bits;
  }

  function bitsToText(bits) {
    if (bits.length < LENGTH_BITS) return "";

    let len = 0;
    for (let i = 0; i < LENGTH_BITS; i++) len = (len << 1) | bits[i];

    const maxBytes = Math.floor((bits.length - LENGTH_BITS) / 8);
    const count = Math.min(len, maxBytes);
    const bytes = new Uint8Array(count);
    for (let c = 0; c < count; c++) {
      let code = 0;
      const base = LENGTH_BITS + c * 8;
      for (let b = 0; b < 8; b++) code = (code << 1) | bits[base + b];
      bytes[c] = code;
    }
    return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
  }

  function encodeBitsIntoImageData(imageData, bits) {
    const pixels = imageData.width * imageData.height;
    if (bits.length > pixels) {
      throw new Error(`Need ${bits.length} pixels, carrier has only ${pixels}.`);
    }
    for (let i = 0; i < bits.length; i++) {
      setPixelBit(imageData.data, i, bits[i]);
    }
  }

  function decodeBitsFromImageData(imageData, bitCount) {
    const pixels = imageData.width * imageData.height;
    const n = Math.min(bitCount, pixels);
    const bits = new Array(n);
    for (let i = 0; i < n; i++) bits[i] = pixelBit(imageData.data, i);
    return bits;
  }

  /** Drawing: dark ink → bit 1 (odd/black), light → bit 0 (even/white). */
  /**
   * Handwritten note → strict B/W bits for parity encode.
   * White (near #fff) → 0 (even); any other color → 1 (odd/black).
   * Anti-aliased greys count as ink (black).
   */
  function drawingToBits(sourceCanvas) {
    const w = sourceCanvas.width;
    const h = sourceCanvas.height;
    const ctx = sourceCanvas.getContext("2d", { willReadFrequently: true });
    const src = ctx.getImageData(0, 0, w, h).data;
    const bits = new Array(w * h);
    // Near-white paper only; everything else is black ink in the encoded note.
    const WHITE_MIN = 250;
    for (let i = 0; i < w * h; i++) {
      const o = i * 4;
      const r = src[o];
      const g = src[o + 1];
      const b = src[o + 2];
      const isWhite = r >= WHITE_MIN && g >= WHITE_MIN && b >= WHITE_MIN;
      bits[i] = isWhite ? 0 : 1;
    }
    return { bits, width: w, height: h };
  }

  function bitsToBwImageData(bits, width, height) {
    const imageData = decryptCtx.createImageData(width, height);
    const d = imageData.data;
    for (let i = 0; i < width * height; i++) {
      const v = bits[i] ? 0 : 255; // odd/black vs even/white
      const o = i * 4;
      d[o] = v;
      d[o + 1] = v;
      d[o + 2] = v;
      d[o + 3] = 255;
    }
    return imageData;
  }

  function encryptText() {
    const text = els.message.value;
    if (!text) {
      setStatus(t("emptyText"));
      return;
    }
    try {
      const resolved = resolveKey();
      if (!resolved.ok) {
        setStatus(resolved.error);
        return;
      }
      const { key, withoutKey } = resolved;
      const plainBits = textToBits(text);
      const bits = applyKeyToBits(plainBits, key);
      // Stretch template up when text needs more pixels than the carrier has
      const carrier = stretchTemplateForBitCount(bits.length);
      const ctx = carrier.getContext("2d", { willReadFrequently: true });
      const imageData = ctx.getImageData(0, 0, carrier.width, carrier.height);
      encodeBitsIntoImageData(imageData, bits);
      ctx.putImageData(imageData, 0, 0);
      downloadCanvas(carrier, "encrypted-text.png");
      setStatus(
        keyStatusPrefix(t("actionEncrypt"), withoutKey, key) +
          ` ${text.length} character(s) → PNG ${carrier.width}×${carrier.height}` +
          (customTemplateName ? ` · template: ${customTemplateName}` : " · default template") +
          (bits.length > CARRIER_W * CARRIER_H ? " · template stretched for text size" : "") +
          "."
      );
    } catch (err) {
      setStatus(err.message || String(err));
    }
  }

  /**
   * Encrypt a note bit-plane (from drawing or remembered Refresh payload).
   * plainBits length must be noteW*noteH (or full carrier size).
   */
  async function encryptPictureFromBits(noteBits, noteW, noteH) {
    const resolved = resolveKey();
    if (!resolved.ok) {
      setStatus(resolved.error);
      return false;
    }
    const { key, withoutKey } = resolved;

    const inkCount = noteBits.reduce((n, b) => n + (b ? 1 : 0), 0);
    if (inkCount === 0) {
      setStatus(t("emptyNote"));
      return false;
    }

    const carrier = expandTemplateToNoteSize(noteW, noteH);
    const cw = carrier.width;
    const ch = carrier.height;

    const plainBits = new Array(cw * ch);
    for (let y = 0; y < ch; y++) {
      for (let x = 0; x < cw; x++) {
        const i = y * cw + x;
        if (x < noteW && y < noteH) plainBits[i] = noteBits[y * noteW + x] & 1;
        else plainBits[i] = 0;
      }
    }

    const bits = applyKeyToBits(plainBits, key);
    const ctx = carrier.getContext("2d", { willReadFrequently: true, colorSpace: "srgb" });
    const imageData = ctx.getImageData(0, 0, cw, ch);
    encodeBitsIntoImageData(imageData, bits);
    ctx.putImageData(imageData, 0, 0);

    const check = ctx.getImageData(0, 0, cw, ch);
    let odd = 0;
    let mismatch = 0;
    for (let i = 0; i < cw * ch; i++) {
      const bit = pixelBit(check.data, i);
      odd += bit;
      if (bit !== (bits[i] & 1)) mismatch++;
    }
    if (mismatch > 0 || odd === 0) {
      setStatus(
        `Encode failed on canvas: mismatch ${mismatch}, odd ${odd}. Try another template.`
      );
      return false;
    }

    const blob = await canvasToPngBlob(carrier);
    const reloaded = await loadExactPixelCanvas(blob);
    const rctx = reloaded.getContext("2d", { willReadFrequently: true });
    const re = rctx.getImageData(0, 0, reloaded.width, reloaded.height);
    let oddPng = 0;
    let mismatchPng = 0;
    const nCheck = Math.min(cw * ch, reloaded.width * reloaded.height);
    for (let i = 0; i < nCheck; i++) {
      const bit = pixelBit(re.data, i);
      oddPng += bit;
      if (bit !== (bits[i] & 1)) mismatchPng++;
    }
    if (mismatchPng > nCheck * 0.01 || oddPng < inkCount * 0.5) {
      setStatus(
        `PNG round-trip lost parity (mismatch ${mismatchPng}, odd ${oddPng}/${odd}). ` +
          `Keep the file as PNG; do not re-save in the gallery.`
      );
      return false;
    }

    downloadBlob(blob, "encrypted-note.png");
    setStatus(
      keyStatusPrefix(t("actionEncrypt"), withoutKey, key) +
        ` Note → template ${cw}×${ch} (still looks like template). ` +
        `even=white / odd=ink on Decrypt. ink ${inkCount}, odd ${oddPng}.` +
        (customTemplateName ? ` · ${customTemplateName}` : " · default template")
    );
    return true;
  }

  async function encryptPicture() {
    try {
      const noteW = els.drawCanvas.width;
      const noteH = els.drawCanvas.height;
      const { bits: noteBits } = drawingToBits(els.drawCanvas);
      await encryptPictureFromBits(noteBits, noteW, noteH);
    } catch (err) {
      setStatus(err.message || String(err));
    }
  }

  function encrypt() {
    if (mode === "text") encryptText();
    else {
      setStatus(t("encryptingNote"));
      encryptPicture();
    }
  }

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(
          new Error(
            `“${file.name}” is not a picture the browser can open. Pick an image file (any folder is OK).`
          )
        );
      };
      img.src = url;
    });
  }

  /**
   * Load image into a canvas with exact pixels when possible.
   * Avoids color-management shifts that destroy RGBA sum parity on decrypt
   * (that bug showed as an all-white note).
   */
  async function loadExactPixelCanvas(file) {
    const buf =
      file instanceof Blob ? await file.arrayBuffer() : null;

    // Prefer ImageDecoder (raw PNG frames, no color manage) when available
    if (buf && typeof ImageDecoder !== "undefined") {
      try {
        const type = (file.type && file.type.startsWith("image/")) ? file.type : "image/png";
        const decoder = new ImageDecoder({ data: buf, type });
        const { image } = await decoder.decode({ frameIndex: 0 });
        const canvas = document.createElement("canvas");
        canvas.width = image.displayWidth || image.codedWidth;
        canvas.height = image.displayHeight || image.codedHeight;
        const ctx = canvas.getContext("2d", {
          willReadFrequently: true,
          colorSpace: "srgb",
          alpha: true,
        });
        ctx.drawImage(image, 0, 0);
        if (image.close) image.close();
        if (decoder.close) decoder.close();
        return canvas;
      } catch (_) {
        /* fall through */
      }
    }

    let bitmap = null;
    try {
      bitmap = await createImageBitmap(file, {
        colorSpaceConversion: "none",
        premultiplyAlpha: "none",
      });
    } catch (_) {
      const img = await loadImageFromFile(file);
      try {
        bitmap = await createImageBitmap(img, {
          colorSpaceConversion: "none",
          premultiplyAlpha: "none",
        });
      } catch (_) {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext("2d", { willReadFrequently: true, colorSpace: "srgb" });
        ctx.drawImage(img, 0, 0);
        return canvas;
      }
    }
    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const ctx = canvas.getContext("2d", { willReadFrequently: true, colorSpace: "srgb" });
    ctx.drawImage(bitmap, 0, 0);
    if (bitmap.close) bitmap.close();
    return canvas;
  }

  function readLengthFromBits(bits) {
    if (bits.length < LENGTH_BITS) return -1;
    let len = 0;
    for (let i = 0; i < LENGTH_BITS; i++) len = (len << 1) | bits[i];
    return len >>> 0;
  }

  /** How much a decoded string looks like real text (0..1). */
  function scoreTextCandidate(bits) {
    const pixels = bits.length;
    const maxBytes = Math.floor((pixels - LENGTH_BITS) / 8);
    const len = readLengthFromBits(bits);
    if (len < 0 || len > maxBytes || len > 20000) {
      return { score: 0, text: "", reason: "bad length" };
    }
    if (len === 0) {
      return { score: 0.05, text: "", reason: "empty" };
    }

    const text = bitsToText(bits);
    if (!text) {
      return { score: 0, text: "", reason: "empty decode" };
    }

    const utf8Len = new TextEncoder().encode(text).length;
    let score = 0;
    if (utf8Len === len) score += 0.25;
    else score += Math.max(0, 0.25 - Math.abs(utf8Len - len) / Math.max(len, 1));

    let printable = 0;
    let letters = 0;
    let weird = 0;
    for (const ch of text) {
      const cp = ch.codePointAt(0);
      const isLetter =
        (cp >= 0x41 && cp <= 0x5a) ||
        (cp >= 0x61 && cp <= 0x7a) ||
        (cp >= 0x400 && cp <= 0x4ff) ||
        (cp >= 0x500 && cp <= 0x52f);
      const isPrint =
        ch === "\n" ||
        ch === "\r" ||
        ch === "\t" ||
        (cp >= 0x20 && cp <= 0x7e) ||
        (cp >= 0xa0 && cp < 0xd800) ||
        (cp >= 0xe000 && cp <= 0xfffd);
      if (isPrint) printable++;
      else weird++;
      if (isLetter || (cp >= 0x30 && cp <= 0x39)) letters++;
    }
    const n = Math.max(text.length, 1);
    const printableRatio = printable / n;
    const letterRatio = letters / n;
    score += 0.45 * printableRatio;
    score += 0.25 * Math.min(1, letterRatio / 0.35);
    if (weird > 0) score -= Math.min(0.4, weird / n);
    if (len >= 1 && len <= 4 && printableRatio > 0.9) score += 0.1;
    score = Math.max(0, Math.min(1, score));
    return { score, text, reason: `print=${printableRatio.toFixed(2)}` };
  }

  /** How much a B/W bit plane looks like a drawing (0..1), not random noise. */
  function scorePictureCandidate(bits, width, height) {
    const n = width * height;
    if (n === 0 || bits.length < n) {
      return { score: 0, bits, ink: 0, reason: "empty" };
    }

    let black = 0;
    for (let i = 0; i < n; i++) if (bits[i]) black++;
    const ink = black / n;

    let inkScore = 0;
    // Sparse handwriting
    if (ink > 0.002 && ink < 0.35) {
      const ideal = 0.06;
      inkScore = Math.max(0, 1 - Math.abs(ink - ideal) / 0.3);
    } else if (ink >= 0.35 && ink <= 0.65) {
      // ~50% = unencoded noise (still a valid picture decode)
      inkScore = 0.2;
    } else {
      inkScore = 0.02;
    }

    let same = 0;
    let edges = 0;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = y * width + x;
        if (x + 1 < width) {
          edges++;
          if (bits[i] === bits[i + 1]) same++;
        }
        if (y + 1 < height) {
          edges++;
          if (bits[i] === bits[i + width]) same++;
        }
      }
    }
    const agree = edges ? same / edges : 0.5;
    const agreeScore = Math.max(0, Math.min(1, (agree - 0.55) / 0.4));
    const score = Math.max(0, Math.min(1, 0.45 * inkScore + 0.55 * agreeScore));
    return {
      score,
      bits,
      ink,
      reason: `ink=${(ink * 100).toFixed(1)}% agree=${agree.toFixed(2)}`,
    };
  }

  function showTextDecryptResult(text) {
    els.panelResult.hidden = false;
    if (els.decryptScrollShell) els.decryptScrollShell.hidden = true;
    els.decryptCanvasWrap.hidden = true;
    if (els.decryptTextScroll) els.decryptTextScroll.hidden = false;
    els.decryptText.hidden = false;
    els.decryptText.textContent = text || t("emptyDecrypt");
    els.message.value = text;
  }

  function showPictureDecryptResult(bits, width, height) {
    els.panelResult.hidden = false;
    if (els.decryptTextScroll) els.decryptTextScroll.hidden = true;
    els.decryptCanvas.width = width;
    els.decryptCanvas.height = height;
    const bw = bitsToBwImageData(bits, width, height);
    decryptCtx.putImageData(bw, 0, 0);
    els.decryptText.hidden = true;
    if (els.decryptScrollShell) els.decryptScrollShell.hidden = false;
    els.decryptCanvasWrap.hidden = false;
  }

  async function decryptFromFile(file, options) {
    const fromRefresh = options && options.fromRefresh;
    try {
      const resolved = resolveKey();
      if (!resolved.ok) {
        setStatus(resolved.error);
        return null;
      }
      const { key, withoutKey } = resolved;

      if (file && !fromRefresh) rememberDecryptFile(file);

      // Exact pixels — color management on drawImage was wiping note parity → blank sheet
      const canvas = await loadExactPixelCanvas(file);
      const width = canvas.width;
      const height = canvas.height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const imageData = ctx.getImageData(0, 0, width, height);

      const maxTextBits = Math.min(width * height, LENGTH_BITS + 8 * 20000);
      const textRaw = decodeBitsFromImageData(imageData, maxTextBits);
      const textBits = applyKeyToBits(textRaw, key);
      const textCand = scoreTextCandidate(textBits);

      const picRaw = decodeBitsFromImageData(imageData, width * height);
      const picBits = applyKeyToBits(picRaw, key);
      const picCand = scorePictureCandidate(picBits, width, height);
      const inkPct = (picCand.ink || 0) * 100;
      const looksLikeNoise = inkPct >= 35 && inkPct <= 65;

      // Prefer Note/B/W whenever possible: unencoded template must show noise, not white.
      let chosen;
      if (mode === "picture") chosen = "picture";
      else if (looksLikeNoise) chosen = "picture";
      else if (mode === "text" && textCand.score >= 0.55) chosen = "text";
      else chosen = textCand.score >= picCand.score && textCand.score >= 0.55 ? "text" : "picture";

      const chosenLabel = chosen === "text" ? "text" : "note/B/W";
      setMode(chosen === "text" ? "text" : "picture", { keepResult: true });
      const encodedLikely = !looksLikeNoise && inkPct >= 1 && inkPct < 35;

      if (chosen === "text") {
        showTextDecryptResult(textCand.text);
      } else {
        showPictureDecryptResult(picBits, width, height);
        try {
          els.panelResult.scrollIntoView({ block: "nearest", behavior: "smooth" });
        } catch (_) {
          /* ignore */
        }
      }

      const odd = picBits.reduce((n, b) => n + (b ? 1 : 0), 0);
      const keyMsg = keyStatusPrefix(t("actionDecrypt"), withoutKey, key);
      const shape = looksLikeNoise
        ? "unencoded → B/W noise (not white)"
        : inkPct < 1
          ? "almost all even → white (parity missing / bad file)"
          : encodedLikely
            ? "looks encoded (odd=ink lines)"
            : "B/W parity map";
      const refreshHint =
        fromRefresh || !lastDecryptBlob ? "" : " · Key change → Refresh (same file)";
      setStatus(
        `${keyMsg} ${chosenLabel}: even→white, odd→black · odd ${odd} (${inkPct.toFixed(1)}%) · ${shape}.${refreshHint}`
      );
      return {
        chosen,
        text: textCand.text,
        picBits,
        width,
        height,
        encodedLikely,
        looksLikeNoise,
        textScore: textCand.score,
      };
    } catch (err) {
      setStatus(err.message || String(err));
      return null;
    }
  }

  /**
   * Change Key → Refresh: decrypt the already-loaded Decrypt file again with the current Key.
   * No file picker. No encrypt/download. Button is disabled until Decrypt has loaded a file.
   * Key length 1..2: do nothing except show a message (empty OR ≥3 only).
   */
  async function refreshWithCurrentKey() {
    if (!lastDecryptBlob) {
      updateRefreshButton();
      setStatus(t("refreshNeedFile"));
      return;
    }
    const raw = (els.encKey.value || "").trim();
    if (raw.length > 0 && raw.length < MIN_KEY_LEN) {
      setStatus(t("refreshKeyShort", raw.length, MIN_KEY_LEN));
      return;
    }
    const resolved = resolveKey();
    if (!resolved.ok) {
      setStatus(resolved.error);
      return;
    }
    setStatus(t("refreshAgain", lastDecryptName || "file"));
    await decryptFromFile(lastDecryptBlob, { fromRefresh: true });
  }

  /**
   * No accept filter — system file manager with all files / any folder (Downloads on Android).
   */
  function openFilePicker(input) {
    input.removeAttribute("capture");
    input.removeAttribute("accept");
    input.value = "";
    input.click();
  }

  async function loadTextFromFile(file) {
    const text = await file.text();
    els.message.value = text;
    setMode("text", { keepResult: true });
    setStatus(`Loaded “${file.name}” as text (${text.length} character(s)).`);
  }

  // Events
  els.modeText.addEventListener("click", () => setMode("text"));
  els.modePicture.addEventListener("click", () => setMode("picture"));
  els.btnEncrypt.addEventListener("click", encrypt);
  els.btnDecrypt.addEventListener("click", () => {
    openFilePicker(els.fileInput);
    setStatus(t("pickDecrypt"));
  });
  if (els.btnRefresh) {
    els.btnRefresh.addEventListener("click", () => {
      refreshWithCurrentKey().catch((err) => setStatus(err.message || String(err)));
    });
  }
  els.btnTemplate.addEventListener("click", () => {
    openFilePicker(els.templateInput);
    setStatus(t("pickTemplate"));
  });
  els.btnLoadText.addEventListener("click", () => {
    openFilePicker(els.textFileInput);
    setStatus(t("pickText"));
  });
  els.btnClear.addEventListener("click", () => {
    clearDrawing();
    setStatus(t("cleared"));
  });
  if (els.btnGrowNote) {
    els.btnGrowNote.addEventListener("click", () => {
      const w = Math.min(4096, Math.round(els.drawCanvas.width * 1.25));
      const h = Math.min(4096, Math.round(els.drawCanvas.height * 1.25));
      resizeNoteCanvas(w, h);
      setStatus(t("grew", els.drawCanvas.width, els.drawCanvas.height));
    });
  }
  els.fileInput.addEventListener("change", () => {
    const file = els.fileInput.files && els.fileInput.files[0];
    els.fileInput.value = "";
    if (file) decryptFromFile(file);
  });
  els.templateInput.addEventListener("change", () => {
    const file = els.templateInput.files && els.templateInput.files[0];
    els.templateInput.value = "";
    if (file) {
      setTemplateFromFile(file).catch((err) =>
        setStatus(
          (err && err.message) ||
            String(err) ||
            `Could not use “${file.name}” as a picture template.`
        )
      );
    }
  });
  els.textFileInput.addEventListener("change", () => {
    const file = els.textFileInput.files && els.textFileInput.files[0];
    els.textFileInput.value = "";
    if (file) {
      loadTextFromFile(file).catch((err) => setStatus(err.message || String(err)));
    }
  });

  els.drawCanvas.addEventListener("pointerdown", onPointerDown);
  els.drawCanvas.addEventListener("pointermove", onPointerMove);
  els.drawCanvas.addEventListener("pointerup", onPointerUp);
  els.drawCanvas.addEventListener("pointercancel", onPointerUp);
  // Do not end the stroke on pointerleave — with a thick finger line the tip
  // wobbles; ending on leave made gaps ("doesn't cling"). Capture keeps drawing.

  // Finger-friendly scroll buttons (CSS scrollbars are often invisible on Android)
  (function wireScrollButtons() {
    let holdTimer = null;
    let holdTarget = null;
    let holdDx = 0;
    let holdDy = 0;

    function step() {
      if (!holdTarget) return;
      holdTarget.scrollLeft += holdDx;
      holdTarget.scrollTop += holdDy;
    }

    function startHold(btn) {
      const id = btn.getAttribute("data-scroll");
      const pane = id && document.getElementById(id);
      if (!pane) return;
      holdTarget = pane;
      holdDx = Number(btn.getAttribute("data-dx") || 0);
      holdDy = Number(btn.getAttribute("data-dy") || 0);
      step();
      clearInterval(holdTimer);
      holdTimer = setInterval(step, 80);
    }

    function stopHold() {
      clearInterval(holdTimer);
      holdTimer = null;
      holdTarget = null;
    }

    document.querySelectorAll(".scroll-btn").forEach((btn) => {
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        startHold(btn);
      });
      btn.addEventListener("pointerup", stopHold);
      btn.addEventListener("pointercancel", stopHold);
      btn.addEventListener("pointerleave", stopHold);
    });
  })();

  clearDrawing();
  setMode("text");
  try {
    const saved = localStorage.getItem("crypt-lang");
    if (saved === "en" || saved === "ru") lang = saved;
  } catch (_) {
    /* ignore */
  }
  if (els.langRu) {
    els.langRu.addEventListener("change", () => {
      if (els.langRu.checked) setLanguage("ru");
      else if (!els.langEn.checked) setLanguage("ru");
      else setLanguage("en");
    });
  }
  if (els.langEn) {
    els.langEn.addEventListener("change", () => {
      if (els.langEn.checked) setLanguage("en");
      else if (!els.langRu.checked) setLanguage("ru");
      else setLanguage("ru");
    });
  }
  applyLanguage();
  updateRefreshButton();
  const verEl = document.getElementById("appVersion");
  if (verEl) verEl.textContent = APP_VERSION;
  setStatus(APP_VERSION + t("ready"));
})();

  </script>
</body>
