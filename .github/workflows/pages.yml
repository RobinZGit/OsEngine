# Deploy MultiLogicTradePg Angular UI from OsEngine mirror → GitHub Pages
# Site: https://robinzgit.github.io/OsEngine/
# Source tree: related projects/MultiLogicTradePg

name: Deploy MultiLogicTradePg to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'related projects/MultiLogicTradePg/web/**'
      - 'related projects/MultiLogicTradePg/tools/**'
      - 'related projects/MultiLogicTradePg/docs/PROJECT_CONTEXT.md'
      - 'related projects/MultiLogicTradePg/docs/LOCAL_SETUP.md'
      - 'related projects/MultiLogicTradePg/00_create_database.sql'
      - 'related projects/MultiLogicTradePg/01_multilogictrade_tables_and_data.sql'
      - 'related projects/MultiLogicTradePg/02_multilogictrade_functions_and_procedures.sql'
      - 'related projects/MultiLogicTradePg/scripts/generate-offline-schema.mjs'
      - 'related projects/MultiLogicTradePg/scripts/sync-project-context-to-assets.mjs'
      - 'related projects/MultiLogicTradePg/scripts/verify-sql.mjs'
      - 'related projects/MultiLogicTradePg/scripts/verify-indicators.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-osengine-multilogic
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: related projects/MultiLogicTradePg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: related projects/MultiLogicTradePg/web/package-lock.json

      - name: Setup PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client postgresql
        working-directory: .

      - name: Verify SQL scripts (01 + 02 core + indicators)
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGHOST: localhost
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          node scripts/verify-sql.mjs --core-only
          node scripts/verify-indicators.mjs

      - name: Install dependencies
        working-directory: related projects/MultiLogicTradePg/web
        run: npm ci

      - name: Unit tests (Angular)
        working-directory: related projects/MultiLogicTradePg/web
        run: npm run test:unit -- --browsers=ChromeHeadlessCI

      - name: Sync PROJECT_CONTEXT into web assets + offline schema
        working-directory: related projects/MultiLogicTradePg/web
        run: |
          npm run sync:context
          npm run generate:schema

      - name: Build Angular (GitHub Pages /OsEngine/)
        working-directory: related projects/MultiLogicTradePg/web
        run: npx ng build --configuration production --base-href "/OsEngine/"

      - name: Publish Crypt parity-stego (short URL on Pages)
        working-directory: related projects/MultiLogicTradePg
        run: |
          cp tools/parity-stego.html web/dist/web/browser/crypt-parity-stego.html
          cp tools/my-projects.html web/dist/web/browser/my-projects.html
          # Keep assets copy in sync for in-app links
          mkdir -p web/dist/web/browser/assets/tools
          cp tools/parity-stego.html web/dist/web/browser/assets/tools/parity-stego.html
          cp tools/my-projects.html web/dist/web/browser/assets/tools/my-projects.html

      - name: SPA fallback
        working-directory: related projects/MultiLogicTradePg/web
        run: cp dist/web/browser/index.html dist/web/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: related projects/MultiLogicTradePg/web/dist/web/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
